{% extends "base.html" %}
{% block title %}{{ 'Edit draft' if notice else 'Create notice' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit draft' if notice else 'Create notice' }}</h1>
<div class="panel">
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" maxlength="200" required value="{{ form.get('title', '') }}">
    <label for="body">Notice</label>
    <textarea id="body" name="body" required>{{ form.get('body', '') }}</textarea>
    <p>
      <button name="action" value="save" class="secondary">Save draft</button>
      <button name="action" value="publish">Publish</button>
      <a class="btn secondary" href="{{ url_for('faculty.notices') }}">Cancel</a>
    </p>
    <p class="meta">A published notice is visible to everyone and can no longer be edited.</p>
  </form>
</div>
{% endblock %}
